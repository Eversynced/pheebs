name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    strategy:
      # A Windows failure must not cancel the Ubuntu run, or one platform hides the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
