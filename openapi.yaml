openapi: 3.1.0
info:
  title: Pheebs backend contract
  version: "1.2.0"
  description: |
    The routes a Pheebs backend answers. The client holds only a base URL and a
    per-developer token, so anything implementing this contract is a Pheebs backend.

    Four routes are required: `/ingest`, `/validate-token`, `/classify-prompt` and `/otel`.
    `/insights` is optional, and `pheebs insights` reads it. Not serving it leaves a backend
    conformant; the command says so and exits non-zero, which is a report it cannot produce
    rather than a fault in the backend.

    Read `docs/backend-contract.md` alongside this file: it carries the failure semantics
    that a schema cannot express, and three of them are easy to get backwards.

    A working implementation is in `examples/backend-node/`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8787
    description: The reference backend in examples/backend-node
  - url: https://{host}
    description: Your backend
    variables:
      host:
        default: pheebs.example.com

security:
  - pheebsToken: []

paths:
  /ingest:
    post:
      summary: Accept one event envelope
      description: |
        Fire-and-forget. The client never retries and never queues — the local JSONL is the
        durable copy and a hook must not block the agent. Only 401/403 and 422 mean anything
        to the client; every other status, including 5xx, is swallowed.

        The client strips `developer` and `logPath` before sending. Identity is stamped
        server-side from the token; a client-supplied `developer` must be ignored.
      operationId: ingestEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventEnvelope" }
      responses:
        "202":
          description: Accepted. The body is ignored by the client.
        "401":
          description: |
            Token rejected. The client writes `~/.pheebs/.last-transport-error`, which
            `pheebs doctor` surfaces to tell the developer to re-set their token.
        "403":
          description: Token rejected. Handled identically to 401.
        "405":
          description: |
            Any method but `POST`, carrying `Allow: POST`. See `/insights` for why the status is
            pinned rather than left to the framework.
        "422":
          description: |
            Unprocessable envelope. The client writes one line to stderr and moves on.
        "500":
          description: |
            Swallowed by the client. Not retried — do not design around client-side retry.

  /validate-token:
    post:
      summary: Resolve a token to an identity and its consent flags
      description: |
        Unauthenticated: the token being validated travels in the body.

        A 5xx is NOT a verdict. The client treats it as "backend unreachable", degrades
        offline, and preserves any identity it had already resolved. A 4xx is a real
        rejection and the token is not stored. Reversing these means a transient blip locks
        developers out of their own identity.
      operationId: validateToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: A verdict — allowed or not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateResult" }
        "400":
          description: Rejected. The client records an `allowed:false` / `unknown` verdict.
        "405":
          description: |
            Any method but `POST`, carrying `Allow: POST`. See `/insights` for why the status is
            pinned rather than left to the framework.
        "500":
          description: |
            Treated as unreachable, not as a rejection. The client degrades offline.

  /classify-prompt:
    post:
      summary: Classify one prompt into a single intent label
      description: |
        The only route that receives raw developer content, which brings obligations the
        others do not:

        - Answer within 2500 ms. The client aborts at that point and degrades.
        - Enforce consent again server-side. The client checks the token's
          `prompt_collection` before sending, but a client-side check is not a control.
        - Do not persist the prompt. The client promises its users that Pheebs does not keep
          prompt text; a backend that logs prompts breaks that promise on its behalf.
        - Hold the model credential yourself. The client ships none.

        Every degraded path — non-2xx, `allowed:false`, missing `result.label`, timeout —
        lands identically: the event records `prompt_intent: "unclassified"`.
      operationId: classifyPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
      responses:
        "200":
          description: A classification verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassifyResponse" }
        "401":
          description: Token rejected. The client degrades to `unclassified`.
        "405":
          description: |
            Any method but `POST`, carrying `Allow: POST`. See `/insights` for why the status is
            pinned rather than left to the framework.
        "500":
          description: The client degrades to `unclassified`.

  /otel/v1/{signal}:
    post:
      summary: OTLP/HTTP passthrough
      description: |
        The agent's native OpenTelemetry exporter is pointed here with the Pheebs token as
        the bearer; the proxy swaps in the real upstream credential before forwarding.

        The point is that no observability credential ships in the client. Pheebs runs on
        developer machines, where an upstream credential is one you cannot rotate.
      operationId: otelProxy
      parameters:
        - name: signal
          in: path
          required: true
          schema:
            type: string
            enum: [traces, metrics, logs]
      requestBody:
        description: |
          The client always configures protobuf (`http/protobuf` for Claude Code, `binary` for
          Codex). A backend that implements only the JSON variant drops every export.
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Forwarded upstream.
        "401":
          description: Token rejected.
        "405":
          description: |
            Any method but `POST`, carrying `Allow: POST`. See `/insights` for why the status is
            pinned rather than left to the framework.

  /insights:
    get:
      summary: The caller's own model-insight report
      description: |
        What one developer can see about their own work, and what `pheebs insights` renders.
        Optional: an implementer produces the sections they can, and a backend that answers
        `{"days": 30, "sections": {}}` forever is a conformant Pheebs backend. The client draws
        whatever arrives and says why for whatever does not.

        The response is a map of named sections rather than one report, because they are gated
        differently and because the set will grow. The two defined today follow the AI
        Proficiency Model: `repertoire` is Layer 1, which practices the engineer uses;
        `judgement_signals` is Layer 2, what happens to AI output before it ships and whether the
        model behind it was the one the work called for. Pricing is not a third: it hangs off
        `model_fit` as `priced`, because it renders that signal rather than standing beside it. A
        section added later is additive, and a consumer that ignores sections it does not
        recognize keeps working across every future version.

        **The caller's own data, never anyone else's.** Identity comes from the token, as on
        `/validate-token`. No peer comparison and no leaderboard: the company's lens is the
        dashboard layer, this route is the engineer's, and per-developer data seen by anyone but
        that developer turns a coaching tool into a surveillance one. The single exception is
        `team_median` on a judgement signal, which answers "is this normal here" without naming
        anyone or ranking anything.

        Availability, not zeros. A section that cannot be computed says so with `enabled: false`
        and a `reason`. Reporting a real-looking zero to a developer whose data was never
        collected is worse than saying nothing.
      operationId: getInsights
      parameters:
        - name: days
          in: query
          required: false
          description: |
            Window, counted back from now. A backend may clamp it; report what it actually used
            in `days` on the response so the reader is never told a window that was not applied.
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: |
            The sections this backend can produce for this caller. Sections it cannot are either
            absent or present with `enabled: false` and a `reason`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsightsResponse" }
        "401":
          description: Token rejected.
        "405":
          description: |
            Any method but `GET`, carrying `Allow: GET`. Every route in this contract pins the
            status, because a framework that answers an unknown path with 404 answers a wrong
            method the same way unless told otherwise, and a caller cannot tell "no such route"
            from "wrong verb". It matters most here, on the only route that reads.

            The `Allow` header is required by RFC 9110 and is the machine-readable half: a client
            that branches on it needs no table of which route takes which verb.

  /insights/team:
    get:
      summary: The team report, for a manager
      description: |
        The same model read across a team instead of one engineer, and what
        `pheebs insights --team` renders. Optional in exactly the way `/insights` is: a backend
        that does not answer it is still a Pheebs backend, and the client says the route is
        unavailable rather than failing.

        **A separate path because it makes the opposite promise.** `/insights` is scoped to the
        caller and says so in its own description; two of the views here name individuals. Rather
        than weaken that sentence with an exception, the naming lives behind its own path, its own
        role check and its own status code, so a reader of either route knows what it hands out
        without having to read the other.

        **Manager-only, and that is enforced here.** The role comes off the token's own backend
        record, the same lookup that resolves identity on `/validate-token`. That route reports
        the role, but reports it for display: nothing a developer can edit on their own machine
        grants this route, and a token whose record says `engineer` gets `403` whatever the client
        sends. A client that hides the `--team` flag is a courtesy to the reader, not the gate.

        **Who appears by name.** A developer with `opt_out` set is never a row in
        `practice_heatmap` or `signals_by_engineer`. They still count in the views that name
        nobody, the funnel and the team stats and the medians, because dropping them there would
        misstate the team rather than protect anyone. The two views that do name people carry
        `engineers_named` and `engineers_withheld`, so a nine-row table over a team of nine is
        distinguishable from the same table over a team of twelve.

        **Parts, not percentages**, as everywhere else in this contract: a view reports its
        numerator and its denominator and lets the consumer decide the rounding.

        Availability, not zeros, exactly as on `/insights`, but per view as well as per section:
        `dollar_savings` needs a price table that `signals_by_engineer` does not, and one flag
        over the section would hide the six views a manager is entitled to.

        A cohort smaller than the tenant is not defined today. It does not need to be: the
        response names the cohort it answered for, so a backend can grow a selector later and a
        client that ignores it keeps reading the tenant.
      operationId: getTeamInsights
      parameters:
        - name: days
          in: query
          required: false
          description: |
            Window, counted back from now, and clamped and reported exactly as on `/insights`.
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: |
            The team views this backend can produce. Views it cannot are either absent or present
            with `enabled: false` and a `reason`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInsightsResponse" }
        "401":
          description: Token rejected.
        "403":
          description: |
            The token is valid and its record does not carry the `manager` role. Distinct from
            `401` on purpose: the two need different words in front of a reader. A rejected token
            is fixed by setting a working one, and telling a manager to do that sends them round a
            loop that cannot end. The client says team views are a manager's and to ask an admin.

            A backend that serves this route but has no way to mark a token a manager answers
            `403` to every caller, which is correct rather than a gap: no token on it is a
            manager's. One that does not serve the route at all answers `404` instead.
        "404":
          description: |
            This backend does not implement team views. Optional means a real absence is
            expressible, and the client reports it as an unavailable route rather than an error
            with the developer's name on it.
        "405":
          description: "Any method but `GET`, carrying `Allow: GET`, as on every route here."

components:
  securitySchemes:
    pheebsToken:
      type: http
      scheme: bearer
      description: The per-developer Pheebs token, from `~/.pheebs/.token`.

  schemas:
    EventEnvelope:
      type: object
      description: |
        One event. The listed fields are always present; everything else is per-event and
        open-ended, so store extras generically rather than pinning a column per field.
      required: [timestamp, source, event, codebase, ai_tool, session_id, version]
      additionalProperties: true
      properties:
        timestamp:
          type: string
          format: date-time
        source:
          type: string
          const: hook
        event:
          type: string
          enum:
            - session_started
            - model_switched
            - prompt_submitted
            - command_expanded
            - subagent_spawned
            - subagent_completed
            - tool_invoked
            - tool_use_completed
            - tool_use_failed
            - context_compacted
            - compaction_completed
            - task_created
            - task_completed
            - turn_ended
            - session_end
            - permission_requested
            - artifact_found
        codebase:
          type: string
          description: |
            `PHEEBS_CODEBASE_ID` if set (an arbitrary string), else `org/repo` from the git
            remote, else `local/<folder-name>`, else the literal `unknown`.
          examples: ["acme/api", "local/scratch"]
        ai_tool:
          type: string
          enum: [claude_code, cursor, codex]
        session_id:
          type: string
          description: |
            The agent's own session id. Two sentinels are reachable and are NOT unique across
            developers or repos: `unknown` (no session id in the payload) and `scan` (a
            standalone `pheebs scan`). Do not key sessions on this field alone.
        version:
          type: string
          description: The Pheebs client version that produced the row.
        developer:
          type: string
          deprecated: true
          description: |
            Stripped by the client before sending. Documented only so implementers know to
            ignore it if it ever appears — trusting it lets any token claim any identity.
        tool_name:
          type: string
        duration_ms:
          type: number
        model:
          type: string
          description: |
            For `ai_tool: claude_code`, present on `session_started` only — recurring hooks do
            not carry it. Cursor and Codex copy it off any payload that has it, on any event.
        from_model:
          type: string
          description: |
            On `model_switched` (claude_code only): the resolved model id the session ran
            before the switch. Absent when the vendor payload omits it.
        to_model:
          type: string
          description: |
            On `model_switched` (claude_code only): the resolved model id the session runs
            after the switch. Together with `session_started.model` this makes a session's
            model a timeline rather than a single value.
        switch_source:
          type: string
          description: |
            On `model_switched`: what caused the switch, passed through verbatim — treat it as
            an opaque string. Claude Code 2.1.267 declares `command`, `picker` and `sdk` for
            changes a person or an integration asked for, and `auto` (fallback) and `resume`
            (model restored while resuming) for changes it made on its own. That domain is the
            vendor's declaration; only `command` has been observed emitted, so do not assume
            the others arrive.
        start_source:
          type: string
          description: |
            The vendor's own `source` value, passed through verbatim — treat it as an opaque
            string. Emitted on `session_started` by claude_code and codex; Cursor never sets it.
        expansion_type:
          type: string
          description: On `command_expanded`, e.g. `slash_command`.
        agent_type:
          type: string
        agent_id:
          type: string
        is_interrupt:
          type: boolean
        stop_hook_active:
          type: boolean
        reason:
          type: string
          description: On `session_end`.
        trigger_type:
          type: string
          description: |
            On `context_compacted`, and for Codex also on `compaction_completed`. The
            `auto`/`manual` pair is guaranteed only for `claude_code` (it comes from the hook's
            own CLI argument); Cursor and Codex pass the vendor's raw value through.
        tool_intent:
          type: string
          enum: [test_run, build, typecheck, lint, vcs, read, edit, other]
          description: Derived locally from the command; the command itself is never sent.
        vcs_action:
          type: string
          enum: [commit, push, pr_create, other]
        command_name:
          type: string
          description: A slash command or skill name.
        mcp_server_name:
          type: string
        role:
          type: string
          enum: [review, generate]
        prompt_length:
          type: integer
          description: Character count. The prompt text itself is never sent here.
        rule_attachment_count:
          type: integer
          minimum: 1
          description: |
            Cursor only, on `prompt_submitted`: how many rule files were attached to the prompt.
            Never accompanied by a path — the vendor entry's `file_path` is not read. Absent
            means "no rule seen", which is NOT the same as a measured zero: Cursor populates
            attachments on its GUI surface only, so the field is a presence signal and a
            backend must not default it to 0.
        permission_mode:
          type: string
          description: Claude Code only, present on every event (default | plan | acceptEdits | bypassPermissions).
        effort:
          type: string
          description: |
            The reasoning effort level, from whichever field the harness puts it in. Claude Code
            carries it on every event; Cursor carries it on `session_started`, `prompt_submitted`
            and `turn_ended` only, and only from its GUI — its CLI sends no effort at all, so
            absence on Cursor is as often the surface as the setting.
        fast_mode:
          type: string
          description: |
            Cursor only, on the same three events as `effort`. The vendor's undocumented `fast`
            model setting, passed through verbatim — a STRING, and the only value observed is
            `"true"`. Do not treat it as a boolean: `"false"` would be truthy.
        command_source:
          type: string
        background_task_count:
          type: integer
        session_cron_count:
          type: integer
        task_id:
          type: string
        task_subject:
          type: string
          description: |
            FREE TEXT — a human- or model-written background-task title, stored verbatim
            (Claude Code `task_created` / `task_completed`). Size and handle it accordingly;
            it is not an identifier or an enum.
        teammate_name:
          type: string
          description: Free text, as above.
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        status:
          type: string
          description: Cursor — how a turn or sub-agent run ended.
        failure_type:
          type: string
          description: Cursor — on `tool_use_failed`.
        permission_type:
          type: string
          description: Codex — on `permission_requested`.
        approved:
          type: boolean
          description: Codex — on `permission_requested`.
        conversation_id:
          type: string
        generation_id:
          type: string
        requests_verification:
          type: boolean
          description: Rides on the prompt event beside `prompt_intent`, not only in ClassifyResponse.
        classifier_version:
          type: string
          description: Rides on the prompt event beside `prompt_intent`.
        prompt_intent:
          type: string
          description: |
            The classifier's label, or `unclassified` on every gated or degraded path.
        task_scope:
          $ref: "#/components/schemas/TaskScope"
          description: |
            Reserved, and not emitted by any released client. It will sit beside `prompt_intent`
            once the client forwards it from the classifier. Absent whenever the classifier
            degraded, so absence is not `n/a`.
        artifact_type:
          type: string
          description: Emitted on `artifact_found` by the repo scan.
          enum:
            [claude_agents, claude_skills, codex_skills, cursor_commands, mcp_config,
             eval_harness, context_file, hook_config, plugin_enabled]
        count:
          type: integer
        last_modified_bucket:
          type: string
          enum: [today, this_week, this_month, this_quarter, older]

    ValidateResult:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
          description: |
            Informational on THIS route: the client does not read it. It branches on `reason`
            and on the presence of `id`, so a rejection MUST omit `id` — otherwise the token
            is stored as valid and its identity is used on every event. (`allowed` IS honored
            on /classify-prompt.)
        id:
          type: string
          description: The stable identity stamped onto events. Omit it to reject.
        developer:
          type: string
        tenant:
          type: [string, "null"]
        role:
          type: string
          enum: [engineer, manager]
          description: |
            Which report this token can draw. Display only on this route, and on every route: the
            client caches it to decide whether to offer `pheebs insights --team`, and that is a
            courtesy, not a gate. `/insights/team` resolves the role from the token's own record
            on every call and answers `403` when it is not `manager`, so a client that lies about
            this field, or a developer who edits it in `~/.pheebs/`, gains nothing. Absent means
            `engineer`, so a backend that has no notion of roles rejects team views by default.
        opt_out:
          type: boolean
          description: |
            Advisory only in the current client — it changes a message printed by
            `pheebs config set token` and nothing else. It does not suppress ingest and does
            not gate classification; `prompt_collection: false` is the only field that stops
            prompt text being sent. Enforce it server-side if you mean it.
        prompt_collection:
          type: boolean
          description: |
            The tenant's consent gate for /classify-prompt. Cached locally at token-set time
            and NEVER refreshed automatically — nothing on the hook path revalidates it. So
            revoking consent does not reach a machine until its developer re-runs
            `pheebs config set token`. Enforce consent again on every /classify-prompt call;
            that is the only gate that actually revokes.
        reason:
          type: string
          description: |
            On rejection, and read ONLY from a 2xx body — the client maps any non-ok status
            below 500 to `{allowed:false, reason:"unknown"}` without parsing the body, so a
            403 carrying `revoked` is discarded. Send `revoked` in a 200 verdict.
          examples: [revoked, unknown]

    ClassifyResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
          description: |
            The server-side consent gate. `false` makes the client record `unclassified`.
        result:
          type: object
          required: [label]
          properties:
            label:
              type: string
              description: The intent label stored as `prompt_intent`.
            requests_verification:
              type: boolean
            classifier_version:
              type: string
            task_scope:
              $ref: "#/components/schemas/TaskScope"
              description: |
                Optional. A backend that does not size tasks omits it, and stays conformant.

                Specified ahead of the client: `transports/http.ts` copies only `label`,
                `requests_verification` and `classifier_version` today, so a `task_scope` sent now
                is dropped. It will ride onto the prompt event beside `prompt_intent` when the
                client ships model insight, and the client will never derive it locally.

    TaskScope:
      type: string
      enum: [mechanical, bounded, cross_cutting, open_ended, "n/a"]
      description: |
        How large the work in a prompt is, described as work rather than as a model tier: a
        single-file change with an unambiguous spec (`mechanical`), a fix or feature inside known
        code with a clear verification path (`bounded`), a multi-file change, design decision or
        unknown-root-cause debugging (`cross_cutting`), or work with no clear finish line
        (`open_ended`). Only task-shaped and repair-shaped prompts are sized; everything else is
        `n/a`.

        Deliberately not a model name. Which model is enough for which scope is a consumer's
        table that changes with every model release; the label on the prompt is not.

    InsightsResponse:
      type: object
      required: [days, sections]
      properties:
        days:
          type: integer
          description: The window actually used, which may be smaller than the one requested.
        sections:
          type: object
          description: |
            Named sections, and deliberately an open map: a view added later is additive rather
            than a new contract. Two rules make that hold, and both bind on a consumer.

            Ignore a section you do not recognize, rather than failing on it. Treat a missing
            section as "this backend does not produce it", which is not the same as a section
            present with `enabled: false`, which is "this backend produces it, but not for you
            right now" and says why in `reason`.

            `repertoire` and `judgement_signals` are defined below, and they follow the AI
            Proficiency Model's own division: Layer 1 is the harness repertoire and Layer 2 is
            the judgement signals. Pricing is not a section of its own: it hangs off `model_fit`
            as `priced`. A backend may answer `{}` and stay conformant.
          properties:
            judgement_signals: { $ref: "#/components/schemas/JudgementSignalsInsights" }
            repertoire: { $ref: "#/components/schemas/RepertoireInsights" }
          additionalProperties: { $ref: "#/components/schemas/InsightsSection" }

    InsightsSection:
      type: object
      description: |
        What every section shares. A section carries its own availability, because they are
        gated differently: `repertoire` needs only a valid token, while `judgement_signals`
        needs classifier labels for four of its five, which in turn need the tenant's
        prompt-collection consent. Only `verification_coverage` survives without either, and it
        undercounts. One flag over the whole report would hide views the caller is entitled to.
      required: [enabled]
      additionalProperties: true
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          enum: [no_consent, not_implemented, insufficient_data]
          description: |
            Why the section is off, present only when `enabled` is false. `no_consent` is not a
            secret from the caller: `/validate-token` already hands the same client its tenant's
            `prompt_collection`, and a bare `false` is indistinguishable from a broken backend,
            which turns a policy answer into a support ticket. `insufficient_data` is the honest
            answer for a developer with too few sessions to say anything about, and must not be
            rendered as a zero.

    CostBasis:
      type: string
      const: API list-price equivalent, estimated upper bound
      description: |
        Carried in the payload rather than left to the reader, and it must be rendered next to
        every figure in `priced`. Both halves are load-bearing. *List-price equivalent*:
        on a seat-based plan the real saving is zero. *Estimated upper bound*: the cheaper model
        was never run, so its token count is unknowable, and a weaker model that needs more turns
        can cost more than the estimate says it saves.

    ModelFitPriced:
      type: object
      description: |
        `model_fit` in dollars, at API list price, over the same sessions the signal counts. A
        rendering of that signal rather than a dimension beside it, which is why it hangs here
        instead of standing as its own section: a backend that cannot price anything still
        reports the fit rate above it, and only the over-provisioned share of it reaches a
        figure.

        **Needs the most of an implementer**: per-session token counts from the agent's own
        telemetry and a price table, on top of the scope labels `model_fit` already needs. It is
        the part most likely to stay unavailable on a self-hosted backend, and that is a
        conformant answer.
      required: [available]
      additionalProperties: true
      properties:
        available:
          type: boolean
          description: |
            Its own flag rather than the section-level `enabled`, because the section it sits in
            can be on while this is off: the fit rate is the measurement and this is one way of
            drawing it. There is no consent gate here, because there is nothing left to gate.
            `model_fit` already needs a scope label per prompt, so a tenant without
            `prompt_collection` has no fit rate for this to price.
        reason:
          type: string
          enum: [not_implemented, insufficient_data]
          description: |
            Why pricing is off, present only when `available` is false. `not_implemented` is the
            honest answer from a backend that computes the rate and prices nothing.
            `insufficient_data` covers a developer whose sessions carry no token telemetry at
            all, which today means any harness other than Claude Code. Neither may be rendered
            as a zero: "we cannot see this" is a different fact from "you saved nothing".
        basis: { $ref: "#/components/schemas/CostBasis" }
        sessions_by_recommended_class:
          type: array
          description: |
            Complete sessions only. A session gets a verdict only when every prompt in it
            that should carry a scope does; otherwise one dropped label silently lowers the
            whole session.
          items:
            type: object
            required: [class, sessions]
            properties:
              class:
                type: string
                description: |
                  The cheapest class that handles the largest scope seen in the session.
                  Class names are the backend's own, since the tier map is a consumer table.
                examples: [small, medium, large, frontier]
              sessions: { type: integer }
        savings:
          type: array
          description: |
            One row per model of a lower class than the one actually run, per `basis` above.
            `usd` is not guaranteed positive: cache-read pricing does not scale with the
            tier, so on a cache-heavy session a cheaper model can cost more. Whether such a
            row is shown as a negative saving or suppressed is not fixed by this contract.
          items:
            type: object
            required: [model, usd, sessions]
            properties:
              model: { type: string, examples: ["claude-sonnet-5"] }
              usd: { type: number }
              sessions:
                type: integer
                description: |
                  How many sessions the figure is summed over. Zero sessions means a zero
                  figure: a total summed over nothing cannot be negative.
        effort_suggestions:
          type: integer
          description: |
            Sessions that ran at a high effort level while their work did not call for it. A
            count and no dollar figure, because the same model at lower effort is a real
            lever but not a priced one.
        scope_distribution:
          type: array
          description: |
            What kind of work the developer brings, which is an insight in itself: a
            developer whose prompts are mostly `open_ended` may be under-specifying rather
            than over-modelling.
          items:
            type: object
            required: [scope, prompts]
            properties:
              scope: { $ref: "#/components/schemas/TaskScope" }
              prompts: { type: integer }
        cache:
          type: object
          description: Cache behavior, which moves cost more than model choice on long sessions.
          properties:
            hit_share: { type: number, minimum: 0, maximum: 1 }
            unreused_write_share:
              type: number
              minimum: 0
              maximum: 1
              description: Cache writes that were never read back, which is pure cost.
            share_of_cost: { type: number, minimum: 0, maximum: 1 }
      # Available pricing must carry its basis. The label is the part that keeps a list-price
      # comparison from reading as money saved, so it is required, not advised.
      if:
        properties:
          available: { const: true }
      then:
        required: [basis]
        properties:
          basis: { $ref: "#/components/schemas/CostBasis" }
    RepertoireInsights:
      description: |
        Layer 1 of the AI Proficiency Model: which practices this engineer actually uses. Gated on
        nothing but a valid token, because it is derived from telemetry the developer already sends
        and shows it back to them. Every field is optional, so a backend reports what it computes
        and omits the rest.

        **Implementable from the event stream alone.** Everything here is a rollup of events a
        Pheebs backend already stores, so a self-hoster can produce this section with no classifier,
        no model prices and no metrics pipeline.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            sessions:
              type: integer
              description: Sessions in the window, the denominator for everything else here.
            active_weeks:
              type: integer
              description: |
                Weeks carrying at least one session. The model needs two before it places a
                practice at all, so a backend below that should answer `insufficient_data` rather
                than report states nobody should read.
            coverage_index:
              type: object
              description: |
                Practices at Recurring over practices that apply on this engineer's harness mix.
                Reported as its two parts rather than a percentage, so the consumer renders the
                share and the denominator without the backend deciding the rounding.
              properties:
                recurring: { type: integer }
                applicable: { type: integer }
            competencies:
              type: array
              description: The profile, one row per competency. This is what the engineer reads.
              items: { $ref: "#/components/schemas/CompetencyState" }
            artifact_breadth:
              type: integer
              description: |
                Distinct skills and slash commands invoked. A raw count on purpose: no cutoff has
                been calibrated, and inventing one would put an arbitrary threshold in a contract.
            compaction:
              type: object
              description: |
                How this engineer's sessions compact. A high `auto` share against a low `manual`
                one is a context-discipline signal, not a fault.
              properties:
                auto: { type: integer }
                manual: { type: integer }

    JudgementSignalsInsights:
      description: |
        Layer 2: what happens to AI output before it ships, and whether the model behind it was
        the one the work called for. Rates and ratios that move in both directions, with no levels
        and no ranking.

        Four of the five need classifier labels, so a backend without them omits those fields
        rather than reporting a zero. `verification_coverage` is the one that works today: its
        verification family is detected from what actually ran, so it is computable from tool
        events alone. A `requests_verification` prompt counts toward it too, so a backend without
        a classifier undercounts this signal rather than producing the same number by another
        route.

        **Needs a prompt classifier**, for everything except `verification_coverage`, and so the
        tenant's prompt-collection consent with it. A backend without either still answers this
        section honestly with that single signal, which is a real report rather than a degraded
        one.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            verification_coverage: { $ref: "#/components/schemas/JudgementSignal" }
            pushback_rate: { $ref: "#/components/schemas/JudgementSignal" }
            refinement_to_repair: { $ref: "#/components/schemas/JudgementSignal" }
            wholesale_accept: { $ref: "#/components/schemas/WholesaleAcceptSignal" }
            model_fit: { $ref: "#/components/schemas/ModelFitSignal" }

    JudgementSignal:
      type: object
      required: [value, unit]
      description: |
        One signal. `trend` exists so a consumer can draw movement rather than print a number: a
        rate with no history reads as a verdict, and these are meant to be read as direction.
      properties:
        value: { type: number }
        unit:
          type: string
          enum: [share, ratio, count]
          description: |
            How to read `value`, `team_median` and `trend`, which all carry it.
            Required, because the five signals do not agree: four are shares and
            `refinement_to_repair` is a ratio, so a renderer without this prints `2.1` as `210%`.

            `share` is 0 to 1 and renders as a percentage. `ratio` is a multiple and renders as
            `2.1 : 1`. `count` is a whole number of things.

            A consumer that meets a unit it does not know prints the raw value rather than
            guessing, the same rule as an unrecognized section.
        team_median:
          type: number
          description: |
            The one team number in this contract, and deliberately a median rather than a list. It
            answers "is this normal here", which a developer cannot get from their own row. It is
            not a ranking, not a peer breakdown, and not a leaderboard.
        trend:
          type: array
          description: |
            Weekly values, oldest first, over whatever history exists. A four-week deployment shows
            four points rather than a padded series, because padding invents a trend.
          items: { type: number }

    WholesaleAcceptSignal:
      description: |
        AI output that shipped unchallenged: the session produced AI edits and carries no
        pushback, no repair and no verification. `value` is the share of AI-edited lines that
        landed in such a session, weighted by `lines_changed`, and `unit` is `share`.

        **Lines rather than sessions, because the two are not the same accept.** A count of
        sessions treats a rename and a rewrite as the same thing: a one-line rename taken without
        a check and a five-hundred-line refactor taken without a check are one session each.
        `sessions` and `unchallenged` carry the session grain beside the rate, so a consumer can
        show what the share is out of and render the plain session share as a secondary.

        Both are required together, the same reasoning as `model_fit`'s `split`: a numerator
        without its denominator is a number nobody can place.
      allOf:
        - $ref: "#/components/schemas/JudgementSignal"
        - type: object
          required: [sessions, unchallenged]
          properties:
            sessions:
              type: integer
              description: |
                AI-edited sessions in the window, the denominator. Every one of them counts:
                there is no change-size threshold to clear, because a threshold in a contract is
                permanent and none has been calibrated.
            unchallenged:
              type: integer
              description: |
                Of those, the sessions that shipped with no pushback, no repair and no
                verification. At most `sessions`. The session share is this over `sessions`,
                rendered by the consumer rather than arriving rounded.

    ModelFitSignal:
      description: |
        Whether the model that ran a session was the one its work called for. `value` is the share
        that fit, over `sessions`, and `unit` is `share`.

        **Complete sessions only.** A session counts only once every prompt in it that should
        carry a scope does, because one dropped label silently lowers the whole session, and a
        session left out is not the same as a session that missed.

        **A miss in either direction is a miss.** Over-provisioned and under-powered are both
        reported and neither is the worse one. A signal that counted only over-provisioning would
        be a savings argument wearing a rate's clothes, and the savings argument is `priced`.
      allOf:
        - $ref: "#/components/schemas/JudgementSignal"
        - type: object
          properties:
            sessions:
              type: integer
              description: Complete sessions in the window, the denominator behind `value`.
            split:
              type: object
              description: |
                The same sessions by verdict, summing to `sessions`. Counts rather than shares, so
                the consumer renders the rounding and can show what the rate is out of. All three
                are required together: omitting one direction hides half the signal, which is the
                failure this split exists to prevent.
              required: [fit, over_provisioned, under_powered]
              properties:
                fit: { type: integer }
                over_provisioned:
                  type: integer
                  description: |
                    Ran above the class the work called for, and the only part `priced` puts a
                    figure on.
                under_powered:
                  type: integer
                  description: |
                    Ran below it, and never carries a dollar figure. The stronger model is the arm
                    nobody ran, so there is no token count to price it against.
            priced: { $ref: "#/components/schemas/ModelFitPriced" }

    CompetencyState:
      type: object
      description: |
        One competency as it stands for one engineer. Shared by the engineer's own profile and by
        a row of the team `practice_heatmap`, which is the same reading of the same thing and must
        not drift into two vocabularies.
      required: [name, state]
      properties:
        name:
          type: string
          examples: [Models, Artifacts, MCP, Evals, Context management, Orchestration]
        state:
          type: string
          enum: [unobserved, adopted, recurring, insufficient_data, "n/a"]
          description: |
            `n/a` means the harness cannot do it, and it leaves the coverage denominator.
            `insufficient_data` means it cannot be judged yet. Collapsing the two overstates
            coverage for one engineer and understates it for another.
        recurring_share: { type: number, minimum: 0, maximum: 1 }

    TeamInsightsResponse:
      type: object
      description: |
        The team report. Shaped like `InsightsResponse` on purpose, so a consumer that already
        walks sections and per-section availability walks this too, with one addition: the cohort
        it answered for.
      required: [days, team, sections]
      properties:
        days:
          type: integer
          description: The window actually used, which may be smaller than the one requested.
        team: { $ref: "#/components/schemas/TeamCohort" }
        sections:
          type: object
          description: |
            The same open map as `/insights`, and the same two rules: ignore a section you do not
            recognize, and treat absent as "this backend does not produce it" rather than
            "disabled". The two defined follow the model's own layers, and each holds the views of
            that layer rather than one engineer's numbers.
          properties:
            repertoire: { $ref: "#/components/schemas/TeamRepertoireInsights" }
            judgement_signals: { $ref: "#/components/schemas/TeamJudgementSignalsInsights" }
          additionalProperties: { $ref: "#/components/schemas/InsightsSection" }

    TeamCohort:
      type: object
      description: |
        Who the report covers. Present so that a smaller cohort can be introduced later without
        breaking a client: every response already says what it answered for, so a client reading a
        tenant today keeps reading correctly when a backend grows sub-teams, and one that wants a
        sub-team asks for it knowing the shape of the answer.
      required: [kind, engineers]
      properties:
        kind:
          type: string
          description: |
            How the cohort was drawn. `tenant` is the whole tenant and the only kind defined
            today. A consumer that meets a kind it does not know renders the report and prints the
            kind rather than refusing: the numbers are still true of whoever `engineers` counts.
          examples: [tenant]
        engineers:
          type: integer
          description: |
            Developers in the cohort, including any withheld from the views that name people. The
            denominator for every share a consumer computes from this report.
        name:
          type: string
          description: A display name for the cohort, if the backend has one. Never required.

    TeamRepertoireInsights:
      description: |
        Layer 1 across the team: which practices the team actually uses. Gated on nothing but a
        manager's token, because it is a rollup of telemetry the team already sends.

        **Implementable from the event stream alone**, exactly as the engineer's `repertoire` is.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            adoption_funnel: { $ref: "#/components/schemas/AdoptionFunnel" }
            practice_heatmap: { $ref: "#/components/schemas/PracticeHeatmap" }
            team_stats: { $ref: "#/components/schemas/TeamStats" }

    AdoptionFunnel:
      description: |
        How deep adoption runs, past a usage count: per practice, how many of the team have never
        been seen doing it, have done it, and do it repeatedly. The read is the recurring edge.

        Names nobody, so it counts every developer in the cohort, opted out or not.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            practices:
              type: array
              description: |
                One row per practice. The three counts are engineers and sum to the cohort's
                `engineers`, so a consumer can draw the bar without being handed a share.
              items:
                type: object
                required: [name, unobserved, adopted, recurring]
                properties:
                  name:
                    type: string
                    examples: [Models, Artifacts, MCP, Evals, Context management, Orchestration]
                  unobserved: { type: integer }
                  adopted: { type: integer }
                  recurring: { type: integer }

    PracticeHeatmap:
      description: |
        Engineers as rows, competencies as columns. The diagnosis is in the patterns rather than
        the cells: a cold column is structural and the fix is scaffolding, a cold row is a coaching
        conversation.

        **This view names people**, which is why the whole route is manager-only. A developer with
        `opt_out` set is not a row here. `engineers_named` and `engineers_withheld` say how many of
        each, so a short table is never mistaken for a small team.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            competencies:
              type: array
              description: |
                The column order, once, rather than left to the order keys happen to arrive in.
                A row may omit a competency; a consumer renders the gap rather than shifting the
                remaining cells left.
              items: { type: string }
            engineers:
              type: array
              description: One row per named engineer, in the order the backend wants them read.
              items:
                type: object
                required: [developer, competencies]
                properties:
                  developer:
                    type: string
                    description: |
                      The same identity `/validate-token` reports, so a manager reads the name
                      their engineer would recognize rather than an opaque id.
                  competencies:
                    type: array
                    items: { $ref: "#/components/schemas/CompetencyState" }
            engineers_named: { type: integer }
            engineers_withheld:
              type: integer
              description: |
                Developers in the cohort held back from this table because they opted out. A count
                and never a list: naming who was withheld defeats withholding them.

    TeamStats:
      description: |
        The receipts for enablement work: which artifacts earned voluntary reuse, which repos have
        active scaffolding. Aggregates only, with no per-engineer attribution anywhere in it, so
        every developer in the cohort counts toward every stat.

        Each row carries a count against a stated denominator rather than a share, following the
        rest of this contract: `engineers` on the reuse stats is out of the cohort's `engineers`,
        and `repos` on the repo stats is out of `repos` below.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            repos:
              type: integer
              description: |
                Codebases seen in the window, the denominator for every repo count here. Reported
                rather than derived, because a backend may see repos that produced no stat row at
                all and a consumer cannot count those.
            skill_reuse:
              type: array
              description: Skills and slash commands, by how many engineers invoked each.
              items: { $ref: "#/components/schemas/ReuseBreadthRow" }
            subagent_reuse:
              type: array
              description: Sub-agents, by how many engineers spawned each.
              items: { $ref: "#/components/schemas/ReuseBreadthRow" }
            connectors:
              type: array
              description: |
                Connectors used in the window. `reads` and `writes` are split because a connector
                a team only reads from is a different investment from one it writes through.
              items:
                allOf:
                  - $ref: "#/components/schemas/ReuseBreadthRow"
                  - type: object
                    properties:
                      reads: { type: boolean }
                      writes: { type: boolean }
            artifact_types:
              type: array
              description: AI-config artifact types, by how many repos contain each.
              items:
                type: object
                required: [name, repos]
                properties:
                  name:
                    type: string
                    examples: [Skills, Slash commands, MCP config, Context files, Eval harness, Sub-agents]
                  repos: { type: integer }
            mcp_repos_in_use:
              type: integer
              description: Repos with MCP configured and traffic from two or more engineers.
            eval_harness_in_use:
              type: integer
              description: Repos with an eval harness present and exercised in the window.

    ReuseBreadthRow:
      type: object
      description: |
        One reusable thing and how far it spread. `engineers` is a count out of the cohort, not a
        share, and it is breadth rather than volume on purpose: one engineer invoking a skill two
        hundred times is not adoption.
      required: [name, engineers]
      properties:
        name: { type: string }
        engineers: { type: integer }

    TeamJudgementSignalsInsights:
      description: |
        Layer 2 across the team. Same gating as the engineer's section, for the same reason: four
        of the five signals need classifier labels, and so the tenant's prompt-collection consent
        with them.

        Views inside are gated again, because they do not cost the same to build. A backend with
        labels but no price table answers three of these four and says `not_implemented` on
        `dollar_savings`.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            signals_by_engineer: { $ref: "#/components/schemas/SignalsByEngineer" }
            median_movement: { $ref: "#/components/schemas/MedianMovement" }
            wholesale_watch: { $ref: "#/components/schemas/WholesaleWatch" }
            dollar_savings: { $ref: "#/components/schemas/DollarSavings" }

    SignalsByEngineer:
      description: |
        Engineers as rows, the five judgement signals as columns, the team median as the last row.
        The same read as `practice_heatmap` one layer up: a weak cell is a coaching conversation, a
        weak column is structural, the strongest cell in a column is who demos.

        **This view names people**, and withholds opted-out developers exactly as the heatmap does.
        The median is computed over the whole cohort rather than the named rows, because it answers
        "is this normal here" and a median over a filtered team would answer a different question
        without saying so.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            signals:
              type: array
              description: |
                The column order and how to read each column, once. `unit` is here rather than on
                every cell because it is a property of the signal, and a renderer without it prints
                a `ratio` of 2.1 as 210%.
              items:
                type: object
                required: [key, unit]
                properties:
                  key:
                    type: string
                    examples: [verification_coverage, pushback_rate, refinement_to_repair, wholesale_accept, model_fit]
                  unit:
                    type: string
                    enum: [share, ratio, count]
            engineers:
              type: array
              items:
                type: object
                required: [developer, signals]
                properties:
                  developer: { type: string }
                  signals:
                    type: array
                    description: |
                      Cells, keyed rather than positional, so a missing signal for one engineer
                      leaves a gap instead of shifting their row out of alignment with the header.
                    items:
                      type: object
                      required: [key, value]
                      properties:
                        key: { type: string }
                        value: { type: number }
            median:
              type: array
              description: The last row, in the same keyed shape as an engineer's.
              items:
                type: object
                required: [key, value]
                properties:
                  key: { type: string }
                  value: { type: number }
            engineers_named: { type: integer }
            engineers_withheld: { type: integer }

    MedianMovement:
      description: |
        The team trend, computed on the median rather than the mean, so one outlier week from one
        engineer does not read as team movement. Structural fixes ship in Layer 1 terms and this is
        where they show up, which is what the annotations are for.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            signals:
              type: array
              items:
                type: object
                required: [key, unit, trend]
                properties:
                  key: { type: string }
                  unit:
                    type: string
                    enum: [share, ratio, count]
                  trend:
                    type: array
                    description: |
                      Weekly medians, oldest first, over whatever history exists. Send what you
                      have: padding a short series to a fixed length invents a trend, and the
                      client draws no chart at all below two points.
                    items: { type: number }
                  annotations:
                    type: array
                    description: |
                      What changed, and when, so a reader attributes a move to a cause rather than
                      guessing at one. Free text written by the backend operator and never
                      anything derived from a prompt or a diff, and the client treats it as
                      untrusted: it is stripped of control sequences and bounded in length, the
                      same as every other string on this route.
                    items:
                      type: object
                      required: [index, text]
                      properties:
                        index:
                          type: integer
                          description: |
                            Which point in `trend` it marks, zero-based. Out of range is dropped by
                            the client rather than clamped, because a note pinned to the wrong week
                            is worse than a missing one.
                        text: { type: string }

    WholesaleWatch:
      description: |
        Wholesale-accept at the team level: AI output that shipped unchallenged, its direction, and
        the repos it concentrates in.

        **Lines rather than sessions for the headline**, as on the engineer's signal, and both are
        reported because they answer different questions: a session count says how often it
        happens, a line count says how much of the codebase it reached.

        The item list stays personal. A manager reaches an individual instance through the engineer
        it belongs to, not through this view, which is why nothing here names a session or a file.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          properties:
            lines:
              description: AI-edited lines that landed unchallenged, against all AI-edited lines.
              allOf: [{ $ref: "#/components/schemas/WindowPair" }]
            sessions:
              description: Sessions that shipped something unchallenged, against all sessions.
              allOf: [{ $ref: "#/components/schemas/WindowPair" }]
            verification_requested_never_ran:
              type: integer
              description: |
                Sessions this window where a check was asked for and no verification ran. Counted
                apart from the unchallenged total rather than folded into it: the intent was there
                and the loop did not close, which is a different conversation from never asking.
            by_repo:
              type: array
              description: |
                This window only. Where it concentrates, which is the difference between a team
                habit and one codebase with no test harness.
              items:
                type: object
                required: [codebase, unchallenged, total]
                properties:
                  codebase: { type: string }
                  unchallenged: { type: integer }
                  total: { type: integer }

    WindowPair:
      type: object
      description: |
        The same measure over this window and the one before it, each as a numerator over its own
        denominator. Two windows rather than a delta, because a share that moved from 31% to 38%
        over a shrinking team is not the same movement as the same two numbers over a growing one.
      properties:
        this_window:
          allOf: [{ $ref: "#/components/schemas/UnchallengedCount" }]
        last_window:
          allOf: [{ $ref: "#/components/schemas/UnchallengedCount" }]

    UnchallengedCount:
      type: object
      required: [unchallenged, total]
      properties:
        unchallenged: { type: integer }
        total: { type: integer }

    DollarSavings:
      description: |
        A price on the team's model-fit gap. The exec rendering of `model_fit`, not a dimension
        beside it, and the same arithmetic and the same caveat as `model_fit.priced` one layer
        down: `basis` must be rendered next to every figure here.

        **Coverage above the dollars, always.** A savings figure with no coverage line beside it
        reads as the whole team when it may be half of it, and the four buckets do not collapse:
        a session with no telemetry is not a session whose model has no price.

        The most expensive view here to implement, and the likeliest to stay `not_implemented` on
        a self-hosted backend, which is a conformant answer.
      allOf:
        - $ref: "#/components/schemas/InsightsSection"
        - type: object
          required: [basis]
          properties:
            basis: { $ref: "#/components/schemas/CostBasis" }
            opportunity:
              type: number
              description: |
                What the over-provisioned share would not have cost at the cheapest class that
                handled its work, per `basis`. Under-powered sessions never contribute: the
                stronger model is the arm nobody ran.
            spend:
              type: number
              description: |
                List-price spend over the same complete sessions `opportunity` is drawn from, so
                the two are a ratio a reader can trust. Spend over a wider set would understate the
                share and flatter the team.
            coverage:
              type: object
              description: |
                Every session in the window, in four buckets that sum to it. Only `complete`
                sessions carry a verdict or a figure; the other three say why the rest could not,
                and conflating them is what turns an honest gap into a silent one.
              required: [complete, incomplete, no_telemetry, unpriced]
              properties:
                complete:
                  type: integer
                  description: Every prompt that should carry a scope does, and the model is priced.
                incomplete:
                  type: integer
                  description: At least one prompt is missing a scope, so the session gets no verdict.
                no_telemetry:
                  type: integer
                  description: No usage telemetry, so there is nothing to price even with a verdict.
                unpriced:
                  type: integer
                  description: The model ran and is not in the price table, which is an operator gap.
            distribution:
              type: object
              description: |
                The two bars the gap is read from, over `coverage.complete` sessions: what the team
                ran, against what its work was sized for. The distance between them is the
                opportunity, and the dollars above are that distance priced.
              properties:
                actual:
                  type: array
                  description: Sessions by the class of the model that actually ran.
                  items: { $ref: "#/components/schemas/ClassCount" }
                as_sized:
                  type: array
                  description: |
                    The same sessions by the cheapest class that handles the largest scope seen in
                    each, which is the same verdict `model_fit` reaches.
                  items: { $ref: "#/components/schemas/ClassCount" }

    ClassCount:
      type: object
      description: |
        Sessions in one model class. Class names are the backend's own, as everywhere else in this
        contract, since the tier map is a consumer table rather than a fact about an event. A
        consumer renders them in the order given and does not sort them: only the backend knows
        which end of its own scale is the expensive one.
      required: [class, sessions]
      properties:
        class:
          type: string
          examples: [small, medium, large, frontier]
        sessions: { type: integer }
